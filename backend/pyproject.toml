[project]
name = "mnemosyne-backend"
version = "0.1.0"
description = "Django API for Mnemosyne local RAG vaults."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Mnemosyne" }]
dependencies = [
    "django>=5.1.0",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.6.0",
    "python-dotenv>=1.0.1",
    "mnemosyne-rag",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
mnemosyne-rag = { path = "../rag", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
