[project]
name = "mnemosyne-rag"
version = "0.1.0"
description = "Local RAG and semantic search for the Mnemosyne memory palace."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Mnemosyne" }]
dependencies = [
    "chromadb>=0.5.23",
    "fastembed>=0.4.2",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pypdf>=5.1.0",
]

[project.scripts]
mnemosyne-rag = "mnemosyne_rag.cli:main"

[tool.poetry]
packages = [{ include = "mnemosyne_rag" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
